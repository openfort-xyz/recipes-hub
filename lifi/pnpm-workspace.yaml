minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@openfort/*"

overrides:
  postcss@<8.5.23: ">=8.5.23"
  sharp@<0.35.0: ">=0.35.0"
  ws@<8.21.1: ">=8.21.1"

auditConfig:
  ignoreCves:
    # No patched elliptic release; signing is delegated to the embedded wallet.
    - CVE-2025-14505
  ignoreGhsas:
    # js-yaml 4.3.1 clears the cooldown at 2026-08-07 17:40 UTC.
    - GHSA-5p4m-2wfm-xmqj
