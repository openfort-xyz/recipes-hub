packages:
  - backend
  - frontend

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@openfort/*"

overrides:
  axios@<1.18.0: ">=1.18.0"
  uuid@<11.1.1: ">=11.1.1"
  ws@<8.21.1: ">=8.21.1"

auditConfig:
  ignoreCves:
    # No patched elliptic release; signing is delegated to the embedded wallet.
    - CVE-2025-14505
  ignoreGhsas:
    # The advisory names 6.6.2 as patched, but npm has not published it.
    - GHSA-848j-6mx2-7j84
