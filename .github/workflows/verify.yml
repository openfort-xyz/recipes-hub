name: verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir:
          - 7702
          - aave
          - agent-permissions
          - hyperliquid
          - lifi
          - lighter
          - lighter/server
          - morpho
          - mpp
          - near-intents
          - private-payments/backend
          - private-payments/frontend
          - telegram-bot
          - usdc
          - vaults-fyi
          - x402/backend
          - x402/frontend
          - yield-xyz
          - zama-confidential-yield
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      # Same pnpm as the recipes' packageManager field. Corepack would pull the latest
      # major for packages without that field, and pnpm 11+ fails on unapproved build scripts.
      - run: npm install --global pnpm@10.30.3
      - run: pnpm install
      - run: pnpm verify
