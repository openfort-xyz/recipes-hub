minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@openfort/*"

overrides:
  axios@<1.18.0: ">=1.18.0"
  uuid@<11.1.1: ">=11.1.1"
  ws@<8.21.1: ">=8.21.1"

auditConfig:
  ignoreCves:
    # No patched elliptic release; signing is delegated to the embedded wallet.
    - CVE-2025-14505
  ignoreGhsas:
    # expo-router 57 pins query-string ^7 (CJS); the patched decode-uri-component 0.5.0 is ESM-only and breaks it. Remove when expo-router moves off query-string 7.
    - GHSA-vcc3-ghjq-m6fr
